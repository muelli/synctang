name: emulator

# Runs the instrumented tests (android/app/src/androidTest) on a real
# Android emulator. ci.yml only runs the JVM unit tests, so the Keystore
# ECDH path, the MR-1 vectors against the Go side, and the Compose keyboard
# navigation tests have never run in CI.
#
# Needs KVM. GitHub-hosted Linux runners expose it once /dev/kvm is made
# accessible (the udev step below); without it the emulator is unusably
# slow, so the job fails early and says so instead of timing out.
#
# Not covered, because no emulator can: StrongBox and the biometric prompt.
# Those stay a manual test on a real phone.
#
# Not run on pushes to main yet: the first run hung for an hour and was
# cancelled, which turned main red. Run it by hand from the Actions tab, or
# on a pull request, until it has passed once; then add the push trigger
# back.
on:
  pull_request:
    paths:
      - "android/**"
      - "mobile/**"
      - "mrcore/**"
      - ".github/workflows/emulator.yml"
  workflow_dispatch:

jobs:
  instrumented:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is the commit count, so a shallow clone would
          # build every APK as version 1.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Make /dev/kvm usable
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is not present on this runner, so the emulator cannot be hardware accelerated" >&2
            exit 1
          fi
          ls -l /dev/kvm
          nproc
          free -m

      - name: Install the SDK pieces and the NDK
        # Same sdkmanager lookup and "yes |" as the android job in ci.yml,
        # for the same reasons.
        working-directory: .
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under \$ANDROID_HOME ($ANDROID_HOME)" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --install \
            "ndk;27.2.12479018" \
            "emulator" \
            "platform-tools" \
            "system-images;android-34;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install gomobile
        working-directory: .
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build the app and the test APK
        # Before the emulator boots, so the build and the emulator do not
        # compete for the runner's CPUs. One ABI, as in ci.yml, and the
        # one the emulator runs.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          ./gradlew assembleDebug assembleDebugAndroidTest -Psynctang.goMobileTarget=android/amd64

      - name: Show what the boot will have to work with
        # Printed so that a failed boot comes with the facts that usually
        # explain it, without needing a second run to find out.
        if: always()
        timeout-minutes: 3
        working-directory: .
        run: |
          id
          ls -l /dev/kvm || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          ls "$ANDROID_HOME/system-images/android-34/google_apis" || true
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | head -5 || true
          java -version 2>&1 | head -2
          free -m
          df -h / | tail -1

      - name: Boot the emulator
        # Every wait is bounded and a failure prints the emulator's log:
        # see scripts/ci-boot-emulator.sh. The step limit is a backstop.
        timeout-minutes: 20
        working-directory: .
        run: ./scripts/ci-boot-emulator.sh ci

      - name: Run the instrumented tests
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          ./gradlew connectedDebugAndroidTest -Psynctang.goMobileTarget=android/amd64

      - name: Collect logs
        if: always()
        timeout-minutes: 5
        working-directory: .
        run: |
          mkdir -p /tmp/emulator-artifacts
          # Bounded: with no device attached, which is exactly when these
          # logs matter most (the boot failed), adb logcat waits for one
          # for ever, and the first run of this workflow sat here until the
          # job's own limit.
          timeout 60 adb logcat -d > /tmp/emulator-artifacts/logcat.txt 2>&1 || true
          cp /tmp/emulator.log /tmp/emulator-artifacts/emulator.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            /tmp/emulator-artifacts/
          if-no-files-found: warn
