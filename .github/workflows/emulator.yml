# SPDX-License-Identifier: AGPL-3.0-or-later

name: emulator

# Runs the instrumented tests (android/app/src/androidTest) on a real
# Android emulator. ci.yml only runs the JVM unit tests, so the Keystore
# ECDH path, the MR-1 vectors against the Go side, and the Compose keyboard
# navigation tests have never run in CI.
#
# Needs KVM. GitHub-hosted Linux runners expose it once /dev/kvm is made
# accessible (the udev step below); without it the emulator is unusably
# slow, so the job fails early and says so instead of timing out.
#
# Not covered, because no emulator can: StrongBox and the biometric prompt.
# Those stay a manual test on a real phone.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "android/**"
      - "mobile/**"
      - "mrcore/**"
      - ".github/workflows/emulator.yml"
  workflow_dispatch:

jobs:
  instrumented:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is the commit count, so a shallow clone would
          # build every APK as version 1.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Make /dev/kvm usable
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is not present on this runner, so the emulator cannot be hardware accelerated" >&2
            exit 1
          fi
          ls -l /dev/kvm
          nproc
          free -m

      - name: Install the SDK pieces and the NDK
        # Same sdkmanager lookup and "yes |" as the android job in ci.yml,
        # for the same reasons.
        working-directory: .
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under \$ANDROID_HOME ($ANDROID_HOME)" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --install \
            "ndk;27.2.12479018" \
            "emulator" \
            "platform-tools" \
            "system-images;android-34;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install gomobile
        working-directory: .
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build the app and the test APK
        # Before the emulator boots, so the build and the emulator do not
        # compete for the runner's CPUs. One ABI, as in ci.yml, and the
        # one the emulator runs.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          ./gradlew assembleDebug assembleDebugAndroidTest -Psynctang.goMobileTarget=android/amd64

      - name: Boot the emulator
        working-directory: .
        run: |
          AVDMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name avdmanager -type f | head -1)
          echo no | "$AVDMANAGER" create avd -n ci -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force
          # No window, no audio, no snapshot: a clean boot every time.
          # Software rendering is fine with KVM and CPUs that nothing else
          # is using, which is what the runner gives us.
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -gpu swiftshader_indirect \
            -no-snapshot -no-audio -no-boot-anim -accel on -memory 4096 -cores 3 \
            > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          for _ in $(seq 1 90); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ] || { echo "emulator did not finish booting" >&2; tail -30 /tmp/emulator.log >&2; exit 1; }
          # Animations make Compose tests flaky and the system slower.
          for k in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb shell settings put global "$k" 0
          done
          # A stalled system dialog over the app breaks UI tests.
          adb shell settings put global hide_error_dialogs 1

      - name: Run the instrumented tests
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          ./gradlew connectedDebugAndroidTest -Psynctang.goMobileTarget=android/amd64

      - name: Collect logs
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/emulator-artifacts
          adb logcat -d > /tmp/emulator-artifacts/logcat.txt 2>&1 || true
          cp /tmp/emulator.log /tmp/emulator-artifacts/emulator.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            /tmp/emulator-artifacts/
          if-no-files-found: warn
