name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go test ./...

  go-test-privileged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cryptsetup
      - run: sudo go test -tags privileged ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: find dracut scripts -name '*.sh' -print0 | xargs -0 -r shellcheck

  em-dash-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-em-dash.sh

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is the commit count, so a shallow clone would
          # build every APK as version 1.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The app links a gomobile .aar built from mobile/ and mrcore/,
      # so this job needs a Go toolchain and an NDK as well as the SDK.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: android-actions/setup-android@v3
      - name: Install the NDK
        run: sdkmanager --install "ndk;27.2.12479018"
        working-directory: .
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        working-directory: .
      - name: Build and test
        run: ./gradlew assembleDebug testDebugUnitTest
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
