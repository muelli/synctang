# SPDX-License-Identifier: AGPL-3.0-or-later

name: ci

# Runner images are pinned rather than tracking ubuntu-latest, which
# migrates to Ubuntu 26 from 2026-10-19 and would otherwise change the
# build environment under us without a commit saying so. Moved early and
# on purpose: a toolchain change that breaks the Debian packaging or the
# Android build is much cheaper to find now than on the day it is forced.

on:
  push:
    branches: [main]
    # The tag publish-fdroid.yml publishes the app for: the packages built
    # here are then attached to a GitHub release (release-debs, below).
    tags: ['v*']
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"
      - run: go build ./...
      - name: Build the relay and discovery servers the integration tests run through
        # Without these the tests in integration/ skip, and the machine and the key holder
        # are never run through a real relay and discovery server. The Syncthing project's
        # own, built from source at a pinned version.
        run: ./scripts/build-syncthing-servers.sh "$RUNNER_TEMP/stbin"
      # -timeout 20m, not Go's default 10: cmd/synctang-unlocker's tests each
      # format a real LUKS2 image and add a real keyslot, so every one
      # pays argon2id twice over, and the adversarial suite added a
      # dozen more of them. Weakening the key derivation to go faster
      # would stop those tests exercising what actually runs.
      - run: go test -timeout 20m ./...
        env:
          STRELAYSRV: ${{ runner.temp }}/stbin/strelaysrv
          STDISCOSRV: ${{ runner.temp }}/stbin/stdiscosrv
      - name: Fuzz the parsers briefly
        # Everything fuzzed here parses bytes somebody else chose: the
        # wire messages arrive on a connection that is authenticated
        # but not trusted (a stolen key holder is still an enrolled
        # one), and FinishXOnly lifts a peer-supplied coordinate to a
        # curve point. The property is just "never panic", which is
        # the one that matters for a machine at a LUKS prompt with
        # nobody there to restart it.
        #
        # Twenty seconds each is not a campaign; it is enough to catch
        # a target that has stopped building or a regression an earlier
        # run already found, and it keeps the corpus honest. Longer
        # runs belong on a machine with time, not in every push.
        #
        # The fuzz engine sometimes ends a run that found nothing with "context deadline exceeded" (the time
        # limit came while it was working on an input). scripts/ci-fuzz.sh repeats such a run, and never a
        # run that found something.
        run: ./scripts/ci-fuzz.sh 20s FuzzReadMessage FuzzTokenUnmarshal FuzzLiftX FuzzFinishXOnly

  go-test-privileged:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cryptsetup
      - run: sudo go test -timeout 20m -tags privileged ./...

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck groff asciinema expect
      - run: find dracut scripts -name '*.sh' -print0 | xargs -0 -r shellcheck
      - run: ./scripts/test-ci-boot-emulator.sh
      - run: ./scripts/test-secure-initrd.sh
      - run: ./scripts/test-ca-bundles.sh
      - run: ./scripts/test-network-conf.sh
      - run: ./scripts/test-agent-log.sh
      - run: ./scripts/test-manpages.sh
      - run: ./scripts/test-casts.sh
      - run: ./scripts/test-ci-fuzz.sh
      - run: ./scripts/test-release-notes.sh
      - run: ./scripts/emulator-vm/test-idle-shutdown.sh
      - run: SKIP_REAL_AWS_CHECK=1 ./scripts/emulator-vm/test-emu-ctl.sh

  em-dash-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/check-em-dash.sh

  reuse:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to the version REUSE.toml was written against, so a new
      # release of the tool cannot turn this job red by itself.
      - run: python3 -m venv /tmp/reuse && /tmp/reuse/bin/pip install --quiet reuse==6.2.0
      - run: /tmp/reuse/bin/reuse lint

  android:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode is the commit count, so a shallow clone would
          # build every APK as version 1.
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      # The app links a gomobile .aar built from mobile/ and mrcore/,
      # so this job needs a Go toolchain and an NDK as well as the SDK.
      # The SDK itself needs no setup step at all: actions/runner-images
      # documents ubuntu-latest as already carrying a full Android SDK
      # (ANDROID_HOME, ANDROID_SDK_ROOT, sdkmanager on PATH, build-tools
      # 34.0.0 among others already installed). android-actions/
      # setup-android@v3 was failing outright on every single run on
      # this repository since the very first push (checked via the
      # GitHub API's own run history, never once green), well before
      # even reaching its own NDK/SDK component steps; since the SDK it
      # would set up already exists, removing it rather than debugging
      # a third-party action blind (no log access in the environment
      # that found this) is the actual fix, not a workaround.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"
      - name: Install the NDK
        # Two separate things needed fixing here, one at a time,
        # without log access to see which: sdkmanager blocks on an
        # interactive license prompt for any component it does not
        # already have cached (the runner's pre-installed NDK is a
        # different version, 27.3.13750724, so this one is a fresh
        # download; "yes |" is the standard non-interactive
        # workaround, there being no --yes flag), and
        # actions/runner-images documents ANDROID_HOME as set but
        # does not confirm cmdline-tools/sdkmanager is actually on
        # PATH, so this locates it explicitly rather than assuming.
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under \$ANDROID_HOME ($ANDROID_HOME)" >&2
            exit 1
          fi
          echo "using sdkmanager at $SDKMANAGER"
          yes | "$SDKMANAGER" --install "ndk;27.2.12479018"
        working-directory: .
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        working-directory: .
      - name: Build and test
        # Only one ABI: CI is validating that the code compiles and the
        # unit tests pass, not producing a release artifact, and
        # build.gradle.kts's own buildGoMobile task already supports
        # this exact flag for that reason.
        #
        # ANDROID_NDK_HOME is computed here with real shell expansion,
        # not `env: ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/...`:
        # that `${{ }}` expression context only sees variables set via
        # a workflow/job/step env: key, not ANDROID_SDK_ROOT baked into
        # the runner image at the OS level, so it silently evaluated to
        # empty and produced ANDROID_NDK_HOME=/ndk/27.2.12479018 (got
        # the actual Gradle error via a token, after several rounds of
        # fixing real-but-different earlier failures in this same job
        # without log access): gomobile bind rejected that path because
        # its meta/platforms.json is missing, i.e. it is not a real NDK
        # root at all.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          ./gradlew assembleDebug testDebugUnitTest -Psynctang.goMobileTarget=android/amd64

  build-deb:
    runs-on: ubuntu-26.04
    # Job-wide, so it covers the go build inside dpkg-buildpackage and not
    # just one step: see the setup-go pin below for why the default
    # GOTOOLCHAIN=auto would otherwise quietly replace the pinned compiler.
    env:
      GOTOOLCHAIN: local
    permissions:
      # Only the attestation step below needs any of these; the build
      # and verification steps need no elevated permissions at all.
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The package version is 0.0.<commit count>-1, so a shallow
          # clone would build every package as version 0.0.1-1.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Matches go.mod's own "go 1.26.0" directive exactly, and is
          # pinned to a patch release unlike the other jobs here, because a
          # different Go patch release produces a different binary and
          # reproducibility would otherwise be something this job assumes
          # rather than proves.
          #
          # go.mod, not this line, is what actually decides the toolchain:
          # with the default GOTOOLCHAIN=auto, a go.mod requiring a version
          # newer than the installed one makes Go silently download and use
          # that newer one instead, so pinning here alone buys nothing but a
          # wasted download. GOTOOLCHAIN=local below removes that fallback,
          # turning a future divergence between this pin and go.mod into a
          # loud build failure rather than a silent change of compiler.
          go-version: "1.26.0"
      - name: Install packaging tools
        # ubuntu-latest preconfigures several third-party apt repositories
        # this project never uses (docker, nodesource, the GitLab runner
        # repo); a stale signing key or hash mismatch in any single one of
        # them makes apt-get update exit non-zero and fail the whole job,
        # so strip everything except Ubuntu's own sources before updating.
        # "just" runs the deb-repro reproducibility check further down.
        run: |
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends debhelper dpkg-dev fakeroot just
      - name: Generate debian/changelog
        # Not committed: a version baked into a checked-in changelog goes
        # stale the moment anything is tagged, so it is derived here, at
        # build time, from the commit count instead, the same source the
        # packaging uses for the version number itself.
        #
        # The trailer date is the commit's own date, not $(date -R): see
        # the justfile's "deb" target for why (SOURCE_DATE_EPOCH, and
        # hence every timestamp inside the .deb, is derived from it).
        run: |
          version="0.0.$(git rev-list --count HEAD)-1"
          {
            echo "synctang ($version) unstable; urgency=medium"
            echo
            echo "  * CI build from commit ${GITHUB_SHA}."
            echo
            echo " -- synctang CI <noreply@github.com>  $(git log -1 --format=%cD)"
          } > debian/changelog
      - name: Build packages
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            echo "::group::build $arch"
            # dpkg-buildpackage cleans the source tree before each build
            # by default, so the second architecture does not inherit the
            # first one's leftovers. -d skips Build-Depends checking:
            # debian/control names no Go toolchain, since setup-go already
            # provided one, and dpkg-checkbuilddeps would otherwise reject
            # the build for missing it.
            dpkg-buildpackage -us -uc -b -d --host-arch "$arch"
            mv ../*.deb dist/
            echo "::endgroup::"
          done
      - name: Verify architecture and dracut payload
        # Cross-built output is exactly the case that is easy to get
        # silently wrong, e.g. a host binary mislabelled as the target
        # architecture, so check what actually landed rather than trust
        # the build to have done the right thing.
        run: |
          mkdir -p verify/amd64 verify/arm64
          dpkg-deb -x dist/synctang-unlocker_*_arm64.deb verify/arm64
          file verify/arm64/usr/sbin/synctang-unlocker | grep -q 'ARM aarch64'
          dpkg-deb -x dist/synctang-unlocker_*_amd64.deb verify/amd64
          file verify/amd64/usr/sbin/synctang-unlocker | grep -q 'x86-64'
          dpkg-deb -c dist/synctang-dracut_*_all.deb | grep -q 'usr/lib/dracut/modules\.d/90synctang/.*\.sh'
      - name: Check package build reproducibility
        # Builds the packages twice more (native host arch only), deliberately
        # varying umask/TZ/LC_ALL between the two builds, and fails if the
        # resulting .debs are not byte-identical: see the justfile's
        # deb-repro target for the actual comparison. dist/ from the "Build
        # packages" step above is moved aside first and restored afterwards
        # regardless of outcome, since the attestation and upload steps
        # below must still see exactly what that step produced, not this
        # step's own throwaway rebuilds.
        run: |
          mv dist dist-ci
          set +e
          just deb-repro
          status=$?
          set -e
          rm -rf dist dist-a dist-b
          mv dist-ci dist
          exit "$status"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Generate SBOMs
        # Read out of the built packages rather than from go.mod, so the
        # SBOM describes what was linked into the binary that ships.
        #
        # One per package *and* architecture. This job builds amd64 and
        # arm64, so a glob like synctang-unlocker_*.deb matches two
        # files, which is what broke the first version of this step: it
        # passed both to a script taking one. They are different
        # binaries and an SBOM describes exactly one of them.
        #
        # The dracut package deliberately has none: it carries shell
        # scripts and a systemd unit, no compiled code.
        run: |
          for deb in dist/synctang-unlocker_*.deb dist/synctang-keyholder_*.deb; do
            base=$(basename "$deb" .deb)
            pkg=${base%%_*}
            arch=${base##*_}
            ./scripts/generate-sbom.sh "$deb" "sbom/${pkg}-${arch}.cdx.json"
          done
      - name: Check the SBOMs against the source
        # Reading a binary trusts one tool's parse of one file: a
        # misparse, a stripped binary, or the wrong artefact would
        # produce a confidently wrong SBOM rather than a failure. So ask
        # the compiler the same question from source and require the two
        # to agree exactly, per architecture, since the import graph can
        # differ between them.
        run: |
          for cmd in synctang-unlocker synctang-keyholder; do
            for arch in amd64 arm64; do
              ./scripts/verify-sbom-against-source.py \
                "sbom/${cmd}-${arch}.cdx.json" "./cmd/${cmd}" linux "$arch"
            done
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # A pull request, including one from a fork, cannot obtain an
        # id-token, so this step only runs for a push to main or of a
        # release tag; the build
        # and verification steps above still run on pull requests, so
        # packaging breakage is still caught before merge.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        with:
          subject-path: dist/*.deb
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        # One subject per step, and the glob has to pin the architecture
        # as well as the package. Matching only on the package name
        # catches both builds and would attest the amd64 dependency list
        # against the arm64 package, which is worse than not attesting
        # at all: it is a signed statement that happens to be false.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        with:
          subject-path: dist/synctang-unlocker_*_amd64.deb
          sbom-path: sbom/synctang-unlocker-amd64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        with:
          subject-path: dist/synctang-unlocker_*_arm64.deb
          sbom-path: sbom/synctang-unlocker-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        with:
          subject-path: dist/synctang-keyholder_*_amd64.deb
          sbom-path: sbom/synctang-keyholder-amd64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        with:
          subject-path: dist/synctang-keyholder_*_arm64.deb
          sbom-path: sbom/synctang-keyholder-arm64.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synctang-debs
          path: dist/*.deb
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synctang-deb-sboms
          path: sbom/*.cdx.json
          retention-days: 7

  e2e:
    # On a release tag only: the packages the release is made of, in a real machine, unlocked
    # from a laptop and a headless phone. Pushes and pull requests run e2e.yml on its own.
    if: github.ref_type == 'tag'
    needs: build-deb
    uses: ./.github/workflows/e2e.yml
    with:
      use-built-packages: true

  release-debs:
    # Attaches the packages that build-deb made, and nothing rebuilt, to a
    # GitHub release, so that someone installing synctang does not need a Go
    # toolchain, a checkout or "just deb". Only for the v<versionCode> tags
    # that publish the app; a push to main keeps them as the build-deb
    # artifact, which is deleted after a week.
    if: github.ref_type == 'tag'
    needs: [build-deb, e2e]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # Keyless signing: the signature names this workflow, not a key.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit count below is the version the packages carry.
          fetch-depth: 0
      - name: Check the tag names the version the packages carry
        # build-deb versions the packages 0.0.<commit count>-1 and the app's
        # versionCode is the same count, so a tag that is not v<that count>
        # would put a release next to files that say another number.
        run: |
          expected="v$(git rev-list --count HEAD)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME is on a commit whose version is $expected" >&2
            exit 1
          fi
      # Exactly the two artifacts build-deb made, by name. A pattern such as synctang-* also
      # takes the debug APK and the app's SBOMs that build-apk uploads, and the first release
      # went out with them attached.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: synctang-debs
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: synctang-deb-sboms
          path: release
      - name: Only what belongs in the release
        # A guard against the same mistake in another form: the release holds packages and their
        # SBOMs, and nothing else.
        run: |
          cd release
          ls -l
          stray="$(ls | grep -v -E '\.deb$|^(synctang-unlocker|synctang-keyholder)-(amd64|arm64)\.cdx\.json$' || true)"
          if [ -n "$stray" ]; then
            echo "::error::unexpected files in the release: $stray" >&2
            exit 1
          fi
      - name: Checksums
        run: |
          cd release
          ls -l
          sha256sum -- *.deb *.cdx.json > SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign every file with cosign
        # Keyless, with the workflow's identity, and recorded in the public
        # transparency log; "cosign verify-blob" needs no GitHub account or
        # CLI, only the bundle that sits next to each file. SHA256SUMS is
        # signed like the rest, so one verified file vouches for the list.
        run: |
          cd release
          for f in *.deb *.cdx.json SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The page's text is made from the phone app's release note for this version and from what is
          # attached (scripts/release-notes.sh), and is written outside the directory the release is made
          # from. A tag with no release note for it stops here.
          scripts/release-notes.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" \
            "android/fastlane/metadata/android/en-US/changelogs/${GITHUB_REF_NAME#v}.txt" release > "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build-apk:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode is the commit count, so a shallow clone would
          # build every APK as version 1 and silently break updates for
          # anyone who already installed an earlier one.
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.0"
      - name: Install the NDK
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under \$ANDROID_HOME ($ANDROID_HOME)" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --install "ndk;27.2.12479018"
        working-directory: .
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        working-directory: .
      - name: Build the APK
        # Every ABI, unlike the android job above, which builds one for
        # speed because it only needs to know the code compiles. This
        # one produces something a human installs on a phone whose
        # architecture nobody here knows.
        #
        # Debug rather than release: there is no release signing config
        # in this repository, and an unsigned release APK cannot be
        # installed at all, so a "release" build here would produce a
        # file that looks more official and works less. The debug
        # signing key is Android's standard one; nothing about the
        # Keystore or StrongBox behaviour this app exists to exercise
        # differs between the two build types.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          ./gradlew assembleDebug
      - name: Show what was built
        # An APK carrying the wrong set of ABIs installs fine and then
        # fails at the first call into the gomobile library, which is a
        # long way from the cause, so the ABIs are checked here rather
        # than discovered on a phone.
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "built $APK"
          unzip -l "$APK" | grep -E 'lib/|\.so$' | awk '{print $4}' | cut -d/ -f2 | sort -u
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Generate SBOMs
        # The APK needs two, because its dependencies come from two
        # ecosystems and no single tool sees both. The Go half is read
        # out of the libgojni.so that gomobile built; the JVM half comes
        # from Gradle's resolved dependency graph, because nothing can
        # recover it from dex bytecode (syft scanning an APK reports
        # exactly one component: the APK).
        #
        # debugRuntimeClasspath, not the default release one, because a
        # debug APK is what this job builds and attests.
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          ../scripts/generate-sbom.sh "$APK" ../sbom/app-go.cdx.json
          ./gradlew :app:cyclonedxBom -Psynctang.sbomConfig=debugRuntimeClasspath
          cp app/build/reports/bom.json ../sbom/app-jvm.cdx.json
          python3 -c "import json;n=len(json.load(open('../sbom/app-jvm.cdx.json')).get('components',[]));print('app-jvm.cdx.json:',n,'components');exit(0 if n>10 else 'implausibly few JVM components')"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # As with build-deb: a fork's pull request cannot obtain an
        # id-token, so this only runs for a push to main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          subject-path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        # Two attestations for the same APK, one per ecosystem. A
        # consumer needs both to have the whole picture, and saying so
        # in two documents is more honest than merging them into one
        # that hides which evidence came from where.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          subject-path: android/app/build/outputs/apk/debug/*.apk
          sbom-path: sbom/app-go.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          subject-path: android/app/build/outputs/apk/debug/*.apk
          sbom-path: sbom/app-jvm.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synctang-apk-sboms
          path: sbom/*.cdx.json
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Note for whoever installs these: the debug signing key is
        # generated on the runner if it is not already there, so APKs
        # from two different CI runs are not necessarily signed by the
        # same key. Android refuses to update an installed app with a
        # differently-signed one, so moving between builds can need an
        # uninstall first. Acceptable for something used to test on a
        # phone; it would not be for anything people actually rely on.
        with:
          name: synctang-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
