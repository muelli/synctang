name: Bootstrap signing certificates

# One-time setup for the seed-derived signing scheme: derives both signing
# identities from the APP_SIGNING_SEED / FDROID_SIGNING_SEED secrets,
# generates their PUBLIC certificates, and opens a pull request adding them
# under signing/. The certificates are public material (they ship in every
# APK and index); the seeds never leave the secrets store.
#
# Run once via workflow_dispatch. Re-running is safe: the derivation script
# refuses to overwrite existing certificates.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      APP_SIGNING_SEED: ${{ secrets.APP_SIGNING_SEED }}
      FDROID_SIGNING_SEED: ${{ secrets.FDROID_SIGNING_SEED }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive identities and generate certificates
        run: |
          set -euo pipefail
          [ -n "$APP_SIGNING_SEED" ] && [ -n "$FDROID_SIGNING_SEED" ] || {
            echo "::error::Set APP_SIGNING_SEED and FDROID_SIGNING_SEED secrets first"; exit 1; }
          pip install --quiet cryptography
          SEED="$APP_SIGNING_SEED"    scripts/derive-signing-key.py --bootstrap app    "$RUNNER_TEMP/app.p12"    > /dev/null
          SEED="$FDROID_SIGNING_SEED" scripts/derive-signing-key.py --bootstrap fdroid "$RUNNER_TEMP/fdroid.p12" > /dev/null
          echo "## Derived signing identities" >> "$GITHUB_STEP_SUMMARY"
          for role in app fdroid; do
            FP="$(openssl x509 -in "signing/$role-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
            echo "- **$role** certificate SHA-256: \`$FP\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Open pull request with the public certificates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b signing-bootstrap
          git add signing/
          git commit -m "Add public signing certificates (seed-derived identities)"
          git push -u origin signing-bootstrap
          # May be forbidden by the repo setting "Allow GitHub Actions to create
          # ... pull requests"; the branch is pushed either way — open it by hand then.
          gh pr create --base main --head signing-bootstrap \
            --title "Add public signing certificates" \
            --body "Public certificates for the seed-derived signing identities (see \`scripts/derive-signing-key.py\`). Generated by the bootstrap-signing workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — certificate fingerprints are in that run's summary." \
            || echo "::notice::Could not create the PR (repo settings); open one manually from the signing-bootstrap branch."
