# SPDX-License-Identifier: AGPL-3.0-or-later
# SPDX-FileCopyrightText: 2026 Tobias Mueller <muelli@cryptobitch.de>

# Licensing for every file that cannot carry its own header (binary files,
# generated lockfiles, plain-text listings) and the copyright line for
# those that carry only an SPDX-License-Identifier. Checked in CI by
# `reuse lint`.
version = 1
SPDX-PackageName = "synctang"
SPDX-PackageSupplier = "Tobias Mueller <muelli@cryptobitch.de>"
SPDX-PackageDownloadLocation = "https://github.com/muelli/synctang"

# Everything in the repository is AGPL-3.0-or-later unless an annotation
# below says otherwise. "aggregate" adds to what a file already declares,
# so a file with its own SPDX header keeps it.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Tobias Mueller <muelli@cryptobitch.de>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The Gradle wrapper is generated by Gradle and copied in, not ours: the
# scripts carry an Apache-2.0 header and the jar an Apache-2.0
# META-INF/LICENSE. "override" replaces the annotation above for these
# paths, so they are not also declared AGPL. Recorded in THIRD_PARTY.md.
[[annotations]]
path = [
  "android/gradlew",
  "android/gradlew.bat",
  "android/gradle/wrapper/**",
  "android/wp0-spike/gradlew",
  "android/wp0-spike/gradlew.bat",
  "android/wp0-spike/gradle/wrapper/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2015-2021 the original Gradle authors"
SPDX-License-Identifier = "Apache-2.0"
